<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Link Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        a {
            color: white;
            font-size: 28px;
            text-decoration: none;
            position: relative;
            z-index: 2;
            padding: 40px;
            border: 4px solid red;      /* красная обводка */
            border-radius: 50%;         /* делает круг */
            text-align: center;
        }

        .arrow {
            position: absolute;
            color: red;
            font-size: 120px;
            animation: float 2s infinite ease-in-out alternate;
        }

        @keyframes float {
            from { transform: translateY(-20px); }
            to { transform: translateY(20px); }
        }
    </style>
</head>
<body>

<a href="https://youtu.be/lB1CGtpSnMk?t=273" target="_blank">
    ▶ не идите туда
</a>

<!-- стрелки -->
<div class="arrow" style="top:10%; left:50%;">⬇</div>
<div class="arrow" style="bottom:10%; left:50%;">⬆</div>
<div class="arrow" style="top:50%; left:10%;">➡</div>
<div class="arrow" style="top:50%; right:10%;">⬅</div>

<div class="arrow" style="top:20%; left:20%;">↘</div>
<div class="arrow" style="top:20%; right:20%;">↙</div>
<div class="arrow" style="bottom:20%; left:20%;">↗</div>
<div class="arrow" style="bottom:20%; right:20%;">↖</div>

</body>
</html>
